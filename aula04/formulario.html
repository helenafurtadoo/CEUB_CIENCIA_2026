<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Escola Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Escola Virtual</h1>
    <h2>Formulário de Pré-Matrícula</h2>

    <form action="" method="post">

        <fieldset>
            <legend><strong>Dados Pessoais</strong></legend>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="nome_aluno">Nome do Aluno</label>
                    <input type="text" id="nome_aluno" name="nome_aluno" required>
                </div>
                <div class="campo">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email">
                </div>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="nome_mae">Nome da Mãe</label>
                    <input type="text" id="nome_mae" name="nome_mae">
                </div>
                <div class="campo">
                    <label for="nome_pai">Nome do Pai</label>
                    <input type="text" id="nome_pai" name="nome_pai">
                </div>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="nascimento">Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
                </div>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="CPF">CPF</label>
                    <input type="text" id="CPF" name="CPF" maxlength="15" placeholder="000.000.000.00">
                </div>
                <div class="campo">
                    <label for="CEP">CEP</label>
                    <input type="text" id="CEP" name="CEP" maxlength="15" placeholder="00000-00">
                </div>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="matricula">MATRÍCULA</label>
                    <input type="number" id="matricula" name="matricula" maxlength="15" placeholder="000.000.000.00">
                </div>
                <div class="campo">
                    <label for="idade">IDADE</label>
                    <input type="text" id="idade" name="idade" maxlength="15" placeholder="45 anos" readonly>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend><strong>Endereço</strong></legend>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="nome_aluno">LOCADOURO</label>
                    <input type="text" id="locadouro" name="locadouro" required>
                </div>
                <div class="campo">
                    <label for="email">NÚMERO</label>
                    <input type="text" id="numero" name="numero" placeholder="Ex: 123">
                </div>
            </div>

            <div class="campo-grupo">
                <div class="campo">
                    <label for="nome_aluno">COMPLEMENTO</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Ato Bloco...">
                </div>
                <div class="campo">
                    <label for="email">BAIRRO</label>
                    <input type="text" id="bairro" name="bairro">
                </div>
            </div>

            <div class="campo-grupo-tres">
                <div class="campo">
                    <label for="cidade">CIDADE</label>
                    <input type="text" id="cidade" name="cidade">
                </div>
                <div class="campo">
                    <label for="estado">ESTADO</label>
                    <input type="text" id="estado" name="estado">
                </div>
                <div class="campo">
                    <label for="email">CÓDIGO IBGE</label>
                    <input type="text" id="codigoIBGE" name="codioIBGE">
                </div>
            </div>

        </fieldset>

        <fieldset>
            <legend><strong>Informações de Matrícula</strong></legend>

            <table>
                <tr valign="top">
                    <td>
                        <strong>Série</strong>
                        <select id="serie" name="serie">
                            <option value="pre-escolar">Pré-escolar</option>
                            <option value="1ano">1º ano</option>
                            <option value="2ano">2º ano</option>
                            <option value="3ano">3º ano</option>
                            <option value="4ano">4º ano</option>
                            <option value="5ano">5º ano</option>

                            <div class="campo-grupo">
                                <strong class="segunda-lingua">SEGUNDA LINGUA</strong>
                                <div class="campo">
                                    <input type="radio" name="ingles" id="ingles" value="ingles">
                                    <label for="ingles">Inglês</label><br>
                                    <input type="radio" name="espanhol" id="espanhol" value="espanhol">
                                    <label for="espanhol">Espanhol</label><br>
                                </div>


                            </div>
                        </select>

                    </td>

                    <td>
                        <strong>Turno</strong>
                        <input type="radio" name="turno" id="manha" value="manha">
                        <label for="manha">Manhã</label><br>
                        <input type="radio" name="turno" id="tarde" value="tarde">
                        <label for="tarde">Tarde</label>
                    </td>

                    <td>
                        <strong>Atividades Extracurriculares</strong>
                        <input type="checkbox" name="atividades" id="informatica" value="informatica">
                        <label for="informatica">Informática</label>

                        <input type="checkbox" name="atividades" id="musica" value="musica">
                        <label for="musica">Música</label><br>

                        <input type="checkbox" name="atividades" id="balet" value="balet">
                        <label for="balet">Balet</label><br>

                        <input type="checkbox" name="atividades" id="pintura" value="pintura">
                        <label for="pintura">Pintura</label><br>

                        <input type="checkbox" name="atividades" id="judo" value="judo">
                        <label for="judo">Judô</label><br>

                        <input type="checkbox" name="atividades" id="futebol" value="futebol">
                        <label for="futebol">Futebol</label>
                    </td>
                </tr>
            </table>
        </fieldset>

        <div class="botoes">
            <input type="submit" value="Enviar Formulário">
            <input type="reset" value="Limpar Campos">
        </div>

    </form>

</body>
<script>
    const campoCep = document.getElementById('CEP');
    campoCep.addEventListener('input', function () {
        let valor = this.value.replace(/\D/g, ``); //--> EXPRESSAO REGULAR (REGEX) se digitar qualquer tipo de letra, vai trocar por aspas vazias ---> encontrar caracteres que você quer remover.
        if (valor.length > 5) {
            valor = valor.slice(0, 5) + "-" + valor.slice(5, 8); // slice = conta a quantidade de caracteres
        }
        this.value = valor;
    })
    const campoCpf = document.getElementById('CPF');
    campoCpf.addEventListener('input', function () {
        let valor = this.value.replace(/\D/g, ``); //--> EXPRESSAO REGULAR (REGEX) se digitar qualquer tipo de letra, vai trocar por aspas vazias ---> encontrar caracteres que você quer remover.
        if (valor.length > 3) {
            valor = valor.slice(0, 3) + "." + valor.slice(3, 6) + "." + valor.slice(6, 9) + "." + valor.slice(9, 11); // slice = conta a quantidade de caracteres
        }
        this.value = valor;
    })

    const lingua = document.getElementById()

    // Cálculo da idade
    const idade = document.getElementById('idade');
    const nascimento = document.getElementById('nascimento');

    nascimento.addEventListener('input', function () {

        const dataNascimento = new Date(this.value);
        const hoje = new Date();

        let anos = hoje.getFullYear() - dataNascimento.getFullYear();

        if (
            hoje.getMonth < dataNascimento.getMonth ||
            (
                hoje.getMonth === dataNascimento.getMonth() &&
                hoje.getDate < dataNascimento.getDate()
            )
        ) {
            anos--;
        }

        idade.value = anos + 'anos';
    });
</script>

</html>
